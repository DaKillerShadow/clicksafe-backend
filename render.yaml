# =============================================================================
# render.yaml — ClickSafe Backend (Render Free Tier)
# =============================================================================
# FREE TIER NOTES:
#   • Free web services cannot attach a persistent disk (paid-only feature),
#     so there is no `disk:` block here. Anything not committed to the repo
#     or regenerated by build.sh is wiped on every deploy.
#   • The original cron jobs (retrain-weekly / tranco-refresh /
#     phishtank-refresh) have been removed. Render never allows a disk to be
#     attached to a cron job service on ANY plan, so those jobs had no way
#     to hand data to this web service in the first place. To refresh
#     model.pkl / tranco.csv later, either:
#       a) run train_model.py / setup_tranco.py / load_phishtank.py locally
#          and commit the updated files, or
#       b) automate that with a GitHub Action that commits the files and
#          hits a Render deploy hook, or
#       c) move to a paid plan + a background worker, which CAN have a disk.
#
# Services defined here:
#   1. clicksafe-api — the only service: Flask/Gunicorn web API
# =============================================================================

services:
  - type: web
    name: clicksafe-api
    runtime: python
    region: oregon           # change to frankfurt / singapore as needed
    plan: free

    buildCommand: bash build.sh
    startCommand: gunicorn -w 1 -b 0.0.0.0:$PORT --timeout 120 --keep-alive 5 app:app

    # ── Health check ────────────────────────────────────────────────────────
    # Render waits for this to return 200 before routing traffic.
    healthCheckPath: /health

    # ── Environment variables ──────────────────────────────────────────────
    envVars:
      # Required — app.py raises at startup if this is unset/empty.
      - key: INTEL_API_KEY
        sync: false          # set manually in dashboard — never commit this

      # Optional — without this, BlocklistChecker runs in disabled mode
      # (no crash, you just lose real-time Google Safe Browsing lookups).
      - key: GOOGLE_SAFE_BROWSING_KEY
        sync: false

      # CORS: comma-separated allowed origins.
      # Example: https://clicksafe.app,https://app.clicksafe.app
      - key: ALLOWED_ORIGINS
        value: "*"           # tighten to your Flutter web domain in production

      # Selenium: most container platforms (including Render) need this
      # for Chrome to launch without a sandbox.
      - key: CHROME_NO_SANDBOX
        value: "1"

      # Rate limiter: a single free instance, so in-memory storage is fine.
      - key: RATELIMIT_STORAGE_URI
        value: memory://

      # Keep at 1 worker — required while using the memory:// rate limiter.
      - key: WEB_CONCURRENCY
        value: "1"
